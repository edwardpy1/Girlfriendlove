<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will You Be My Valentine?</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: #ffe6f0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Nunito', sans-serif;
    overflow: hidden;
    position: relative;
  }

  /* Floating hearts background */
  .heart-bg {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  .heart-bg span {
    position: absolute;
    bottom: -50px;
    font-size: 1.5rem;
    animation: floatUp linear infinite;
    opacity: 0;
  }

  @keyframes floatUp {
    0%   { transform: translateY(0) rotate(0deg); opacity: 0.7; }
    100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
  }

  /* Card */
  .card {
    background: white;
    border-radius: 32px;
    padding: 48px 40px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(255, 100, 150, 0.25);
    max-width: 420px;
    width: 90%;
    position: relative;
    z-index: 1;
    animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes popIn {
    from { transform: scale(0.5); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }

  .bear {
    font-size: 5rem;
    animation: bounce 1.5s ease-in-out infinite;
    display: block;
    margin-bottom: 16px;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50%       { transform: translateY(-12px); }
  }

  h1 {
    font-family: 'Pacifico', cursive;
    font-size: 1.8rem;
    color: #e84393;
    margin-bottom: 32px;
    line-height: 1.3;
  }

  .buttons {
    display: flex;
    gap: 16px;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
  }

  .yes-btn {
    background: #e84393;
    color: white;
    border: none;
    padding: 16px 40px;
    border-radius: 50px;
    font-size: 1.3rem;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 6px 20px rgba(232, 67, 147, 0.4);
  }

  .yes-btn:hover {
    transform: scale(1.1);
    box-shadow: 0 10px 30px rgba(232, 67, 147, 0.5);
  }

  .no-btn {
    background: #ff6b6b;
    color: white;
    border: none;
    padding: 12px 24px;
    border-radius: 50px;
    font-size: 1rem;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
  }

  /* Celebrate screen */
  .celebrate-screen {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .celebrate-screen.show {
    display: flex;
  }

  .main-content.hide {
    display: none;
  }

  .celebrate-screen h2 {
    font-family: 'Pacifico', cursive;
    font-size: 2rem;
    color: #e84393;
  }

  .celebrate-screen p {
    color: #999;
    font-size: 1.1rem;
  }

  .big-heart {
    font-size: 6rem;
    animation: heartbeat 0.8s ease-in-out infinite;
  }

  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    50%       { transform: scale(1.2); }
  }

  /* Confetti */
  .confetti-piece {
    position: fixed;
    width: 10px;
    height: 10px;
    top: -10px;
    border-radius: 2px;
    animation: confettiFall linear forwards;
    z-index: 999;
  }

  @keyframes confettiFall {
    0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }
</style>
</head>
<body>

<!-- Floating hearts in background -->
<div class="heart-bg" id="heartBg"></div>

<div class="card">
  <!-- Main question -->
  <div class="main-content" id="mainContent">
    <span class="bear">🐻</span>
    <h1>Will you be my Valentine? 🥰</h1>
    <div class="buttons">
      <button class="yes-btn" id="yesBtn">Yes 💖</button>
      <button class="no-btn" id="noBtn">What if I asked really nicely?</button>
    </div>
  </div>

  <!-- Celebrate screen -->
  <div class="celebrate-screen" id="celebrateScreen">
    <span class="big-heart">💖</span>
    <h2>Yay!! 🎉</h2>
    <p>I knew you'd say yes! 🥰</p>
  </div>
</div>

<script>
  // Generate floating hearts in background
  const heartBg = document.getElementById('heartBg');
  const emojis = ['❤️', '💕', '💗', '💓', '💞', '🌸', '✨'];

  for (let i = 0; i < 20; i++) {
    const span = document.createElement('span');
    span.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    span.style.left = Math.random() * 100 + 'vw';
    span.style.animationDuration = (Math.random() * 6 + 4) + 's';
    span.style.animationDelay = (Math.random() * 8) + 's';
    span.style.fontSize = (Math.random() * 1.5 + 0.8) + 'rem';
    heartBg.appendChild(span);
  }

  // No button — runs away
  const noBtn = document.getElementById('noBtn');
  noBtn.addEventListener('mouseover', () => {
    const x = Math.random() * (window.innerWidth - 150);
    const y = Math.random() * (window.innerHeight - 60);
    noBtn.style.position = 'fixed';
    noBtn.style.left = x + 'px';
    noBtn.style.top = y + 'px';
  });

  // Yes button — celebrate
  const yesBtn = document.getElementById('yesBtn');
  yesBtn.addEventListener('click', () => {
    document.getElementById('mainContent').classList.add('hide');
    document.getElementById('celebrateScreen').classList.add('show');
    launchConfetti();
  });

  function launchConfetti() {
    const colors = ['#e84393', '#ff6b6b', '#ffd700', '#7bed9f', '#70a1ff', '#ff4757'];
    for (let i = 0; i < 80; i++) {
      setTimeout(() => {
        const piece = document.createElement('div');
        piece.classList.add('confetti-piece');
        piece.style.left = Math.random() * 100 + 'vw';
        piece.style.background = colors[Math.floor(Math.random() * colors.length)];
        piece.style.animationDuration = (Math.random() * 2 + 2) + 's';
        piece.style.animationDelay = '0s';
        piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
        document.body.appendChild(piece);
        setTimeout(() => piece.remove(), 4000);
      }, i * 30);
    }
  }
</script>
</body>
</html>
